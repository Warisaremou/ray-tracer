name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/devcontainers/cpp:1-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make build
      - name: Test
        run: make test
